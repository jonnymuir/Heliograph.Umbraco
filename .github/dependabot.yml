version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      dotnet:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/src/Heliograph.Umbraco.Client"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      backoffice-client:
        patterns: ["*"]
        update-types: ["minor", "patch"]
