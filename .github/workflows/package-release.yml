name: Package Release

# Publishes Heliograph.Umbraco to nuget.org, where the Umbraco Marketplace finds it by its
# umbraco-marketplace tag. A tag v<version> must match the package's <Version>; a version with a
# hyphen (v0.1.0-alpha.1) is a prerelease.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # NuGet Trusted Publishing (OIDC token exchange)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A mismatch would try to push a version that is already published.
      - name: Verify the package version matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROJECT=src/Heliograph.Umbraco/Heliograph.Umbraco.csproj
          VERSION=$(grep -oE '<Version>[^<]+</Version>' "$PROJECT" | head -1 | sed -E 's#</?Version>##g')
          echo "$PROJECT version: $VERSION"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag ${TAG} does not match <Version>${VERSION}</Version> in $PROJECT."
            exit 1
          fi

      # No cache on purpose: a release must not restore a cache a pull request could have filled.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: '20'
      - name: Build the backoffice client
        working-directory: src/Heliograph.Umbraco.Client
        run: npm ci && npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Heliograph.Umbraco.slnx

      - name: Build
        run: dotnet build Heliograph.Umbraco.slnx -c Release --no-restore

      # The same proof as ci.yml: nothing is published that has not passed against a booted Umbraco.
      - name: Test
        run: dotnet test Heliograph.Umbraco.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/Heliograph.Umbraco/Heliograph.Umbraco.csproj -c Release --no-build -o artifacts

      - name: The backoffice extension is inside the package
        run: unzip -l artifacts/Heliograph.Umbraco.*.nupkg | grep -q 'staticwebassets/umbraco-package.json'

      - name: Upload NuGet package artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heliograph-umbraco-nuget
          path: artifacts/*.nupkg

      # Trusted Publishing: this run's GitHub OIDC token is exchanged for a nuget.org API key that
      # expires in an hour. No long-lived secret is stored. It needs a Trusted Publishing policy on
      # nuget.org for this repo and this workflow file (jonnymuir/Heliograph.Umbraco, package-release.yml).
      - name: NuGet login (OIDC -> temp API key)
        if: startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" -s https://api.nuget.org/v3/index.json --skip-duplicate

      # Last, so a publish that fails leaves no release behind that points at a package nobody can restore.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --generate-notes --prerelease ;;
            *)   gh release create "$TAG" artifacts/*.nupkg --title "$TAG" --generate-notes ;;
          esac
