name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/Heliograph.Umbraco.Client/package-lock.json
      # The package ships the backoffice client as static web assets, so it is built first. Without it the build
      # still passes and the package is empty; the booted-site tests are what fail.
      - name: Install backoffice client dependencies
        working-directory: src/Heliograph.Umbraco.Client
        run: npm ci
      - name: Build backoffice client
        working-directory: src/Heliograph.Umbraco.Client
        run: npm run build
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Heliograph.Umbraco.slnx
      - name: Build
        run: dotnet build Heliograph.Umbraco.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Heliograph.Umbraco.slnx -c Release --no-build
      # Proves the package can be built, so a release never finds out first.
      - name: Pack
        run: dotnet pack Heliograph.Umbraco.slnx -c Release --no-build -o ./artifacts
      - name: Size budgets
        run: node scripts/check-policies.mjs
      - name: Doc links
        run: node scripts/check-doc-links.mjs

  # One aggregate check, so the ruleset names "all" instead of every job.
  all:
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: always()
    permissions: {}
    steps:
      - name: Decide whether checks have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Some checks failed: $RESULTS"
              exit 1
            fi
          done
          echo "All checks passed"
